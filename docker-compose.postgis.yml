services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sealens
      POSTGRES_USER: sealens
      POSTGRES_PASSWORD: change-this-before-any-shared-deployment
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./deploy/postgis/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
volumes:
  postgis_data:
