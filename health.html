<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>seaLens Health & Status</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 40px; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid #334155; }
    .ok { color: #10b981; } .warn { color: #f59e0b; } .err { color: #ef4444; }
    pre { background: #0f172a; padding: 12px; border-radius: 8px; overflow-x: auto; }
    a { color: #60a5fa; }
  </style>
</head>
<body>
  <h1>🌊 seaLens Health & Status</h1>
  <div class="card">
    <h2>API Health</h2>
    <pre id="health">Loading...</pre>
  </div>
  <div class="card">
    <h2>Quick Links</h2>
    <ul>
      <li><a href="/">Landing Page</a></li>
      <li><a href="/c2">C2 Console</a></li>
      <li><a href="/docs">API Docs</a></li>
      <li><a href="/api/health">/api/health (JSON)</a></li>
    </ul>
  </div>
  <div class="card">
    <h2>Offline package</h2>
    <p>No packaged real-data offline subset is currently provided. Use the clearly labelled simulated scenarios if network access is unavailable.</p>
  </div>
  <script>
    fetch('/api/health').then(r=>r.json()).then(d=>{
      document.getElementById('health').textContent = JSON.stringify(d, null, 2);
    }).catch(e=>{
      document.getElementById('health').textContent = 'Error: ' + e.message;
    });
  </script>
</body>
</html>
